<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>見えていた敗北 — 1941年、計算は正しかった。通らなかっただけだ。</title>
<meta name="description" content="1941年の総力戦研究所を舞台に、同じ問題を算盤と現代のORで二度解く意思決定シリアスゲーム。" />
<meta name="theme-color" content="#C9BFA3" />

<meta property="og:type" content="website" />
<meta property="og:title" content="見えていた敗北" />
<meta property="og:description" content="1941年、計算は正しかった。通らなかっただけだ。" />
<meta name="twitter:card" content="summary_large_image" />

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>

<style>
  html, body, #root { margin: 0; padding: 0; min-height: 100%; }
  body {
    background: #C9BFA3;
    -webkit-text-size-adjust: 100%;
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP",
                 "Yu Gothic", Meiryo, system-ui, sans-serif;
  }
  /* 明朝が必要な箇所は font-family: serif を明示している */
  button { -webkit-tap-highlight-color: transparent; }
  input[type="range"] { touch-action: manipulation; }

  #boot {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #C9BFA3; color: #4E5878; font-size: 13px; letter-spacing: 0.3em;
  }
</style>
</head>
<body>
  <div id="root"></div>
  <div id="boot">読み込んでいます</div>

  <noscript>
    <p style="padding:2rem;color:#222C4A;font-size:14px;line-height:2;">
      このページは JavaScript が必要です。ブラウザの設定で有効にしてください。
    </p>
  </noscript>

  <script>
    /* 閣僚の台詞を LLM で生成したい場合のみ、
       CORS 許可済みのプロキシURLをここに設定する。
       未設定なら台本の台詞が使われる（APIキーをページに置いてはいけない）。 */
    // window.__MINISTER_ENDPOINT__ = "https://your-proxy.example.com/messages";

    window.addEventListener("load", function () {
      setTimeout(function () {
        var b = document.getElementById("boot");
        if (b) b.remove();
      }, 400);
    });
  </script>

  <script type="text/babel" data-presets="react" src="./app.jsx"></script>
</body>
</html>
